name: foundation-ci

on:
  push:
    branches: [main, "foundation/**"]
  pull_request:

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Solana development toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL https://solana-install.solana.workers.dev | bash
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          echo "$HOME/.avm/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Select Anchor 1.2.0
        run: |
          avm install 1.2.0
          avm use 1.2.0
          anchor --version
          solana --version

      - name: Install dependencies
        run: yarn install

      - name: Sync program IDs with local deploy keypairs
        run: |
          anchor keys sync
          anchor keys list

      - name: Compile
        run: anchor build --arch v2

      - name: Validate deploy ELF binaries
        run: |
          set -euo pipefail
          for program in lab_core attestation_engine; do
            artifact="target/deploy/${program}.so"
            test -s "$artifact"
            file "$artifact"
            readelf -h "$artifact"
            # EM_BPF = 247 (0xF7) or Solana-specific EM_SBPF = 263 (0x107).
            # Some binutils versions print EM_SBPF as <unknown>: 0x107.
            python3 - "$artifact" <<'PY'
            import struct
            import sys
            from pathlib import Path
            
            data = Path(sys.argv[1]).read_bytes()
            if len(data) < 64 or data[:4] != b"\x7fELF":
                raise SystemExit("Not an ELF binary")
            if data[4] != 2 or data[5] != 1:
                raise SystemExit("Expected 64-bit little-endian ELF")
            machine = struct.unpack_from("<H", data, 18)[0]
            flags = struct.unpack_from("<I", data, 48)[0]
            if machine not in (247, 263):
                raise SystemExit(f"Unexpected ELF machine: {machine:#x}")
            if flags != 2:
                raise SystemExit(f"Expected SBF v2 flags 0x2; got {flags:#x}")
            print(f"Validated SBF v2 ELF: machine={machine:#x} flags={flags:#x}")
            PY
          done

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Create ephemeral CI wallet
        run: |
          mkdir -p "$HOME/.config/solana"
          solana-keygen new --no-bip39-passphrase --silent --force -o "$HOME/.config/solana/id.json"

      - name: Deploy programs to explicit local validator and run 16 tests
        run: |
          set -euo pipefail
          solana-test-validator --reset --quiet > /tmp/solana-lab-validator.log 2>&1 &
          VALIDATOR_PID=$!
          trap 'kill "$VALIDATOR_PID" 2>/dev/null || true; cat /tmp/solana-lab-validator.log' EXIT
          solana config set --url http://127.0.0.1:8899 --keypair "$HOME/.config/solana/id.json"
          for attempt in $(seq 1 60); do
            if solana cluster-version --url http://127.0.0.1:8899 >/dev/null 2>&1; then break; fi
            sleep 1
          done
          solana cluster-version --url http://127.0.0.1:8899
          solana airdrop 100 --url http://127.0.0.1:8899
          anchor deploy --provider.cluster localnet
          anchor keys list
          anchor test --skip-build --skip-local-validator --skip-deploy --provider.cluster localnet
