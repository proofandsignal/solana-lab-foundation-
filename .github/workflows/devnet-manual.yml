name: devnet-manual

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY-DEVNET exactly'
        required: true
        type: string
      expected_commit:
        description: 'Exact reviewed commit SHA to deploy'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: solana-lab-devnet
  cancel-in-progress: false

jobs:
  deploy-devnet:
    if: ${{ inputs.confirmation == 'DEPLOY-DEVNET' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: devnet

    env:
      SOLANA_URL: https://api.devnet.solana.com

    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit }}

      - name: Refuse moving or unexpected commit
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "${{ inputs.expected_commit }}"
          echo "Reviewed commit: $ACTUAL"

      - name: Install Solana development toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSfL https://solana-install.solana.workers.dev | bash
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          echo "$HOME/.avm/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Select Anchor 1.2.0
        shell: bash
        run: |
          set -euo pipefail
          avm install 1.2.0
          avm use 1.2.0
          anchor --version
          solana --version

      - name: Install dependencies
        run: yarn install

      - name: Materialize protected devnet keys
        shell: bash
        env:
          DEVNET_DEPLOYER_KEYPAIR_B64: ${{ secrets.DEVNET_DEPLOYER_KEYPAIR_B64 }}
          LAB_CORE_PROGRAM_KEYPAIR_B64: ${{ secrets.LAB_CORE_PROGRAM_KEYPAIR_B64 }}
          ATTESTATION_PROGRAM_KEYPAIR_B64: ${{ secrets.ATTESTATION_PROGRAM_KEYPAIR_B64 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/solana-keys" target/deploy
          test -n "$DEVNET_DEPLOYER_KEYPAIR_B64"
          test -n "$LAB_CORE_PROGRAM_KEYPAIR_B64"
          test -n "$ATTESTATION_PROGRAM_KEYPAIR_B64"

          printf '%s' "$DEVNET_DEPLOYER_KEYPAIR_B64" | base64 --decode > "$RUNNER_TEMP/solana-keys/deployer.json"
          printf '%s' "$LAB_CORE_PROGRAM_KEYPAIR_B64" | base64 --decode > target/deploy/lab_core-keypair.json
          printf '%s' "$ATTESTATION_PROGRAM_KEYPAIR_B64" | base64 --decode > target/deploy/attestation_engine-keypair.json

          chmod 600 "$RUNNER_TEMP/solana-keys/deployer.json" target/deploy/*-keypair.json

      - name: Devnet identity preflight
        shell: bash
        run: |
          set -euo pipefail
          solana config set --url "$SOLANA_URL" --keypair "$RUNNER_TEMP/solana-keys/deployer.json"
          ./scripts/devnet-preflight.sh             target/deploy/lab_core-keypair.json             target/deploy/attestation_engine-keypair.json

      - name: Build reviewed source
        run: anchor build

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Deploy Core and Attestation to devnet
        shell: bash
        run: |
          set -euo pipefail
          anchor deploy --provider.cluster devnet --provider.wallet "$RUNNER_TEMP/solana-keys/deployer.json"

      - name: Capture public deployment evidence
        shell: bash
        run: |
          set -euo pipefail
          CORE_ID="$(solana-keygen pubkey target/deploy/lab_core-keypair.json)"
          ATTEST_ID="$(solana-keygen pubkey target/deploy/attestation_engine-keypair.json)"
          {
            echo "# Devnet deployment evidence"
            echo
            echo "- Commit: $(git rev-parse HEAD)"
            echo "- UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "- RPC: $SOLANA_URL"
            echo "- Core program ID: $CORE_ID"
            echo "- Attestation program ID: $ATTEST_ID"
            echo
            echo "## Core program"
            solana program show "$CORE_ID" --url "$SOLANA_URL"
            echo
            echo "## Attestation program"
            solana program show "$ATTEST_ID" --url "$SOLANA_URL"
          } | tee "$RUNNER_TEMP/devnet-deployment-evidence.md"

      - name: Upload public evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: devnet-deployment-evidence
          path: ${{ runner.temp }}/devnet-deployment-evidence.md
          if-no-files-found: error
          retention-days: 30

      - name: Destroy temporary key files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/solana-keys/deployer.json"
          rm -f target/deploy/lab_core-keypair.json
          rm -f target/deploy/attestation_engine-keypair.json
